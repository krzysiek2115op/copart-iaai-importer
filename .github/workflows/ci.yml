# CI: testy jednostkowe obu scraperów (auta + motocykle) oraz lint PHP wtyczek.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN tylko do odczytu — zaden job nie pisze do repo.
permissions:
  contents: read

# Kolejny push do tej samej galezi ANULUJE trwajacy przebieg — nie placimy
# minutami Actions za wynik, ktorego juz nikt nie ogląda.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [auta-iaai, motocykle-poleasingowe]
    defaults:
      run:
        working-directory: ${{ matrix.project }}/scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install pytest pymysql jsonschema requests
      - name: Testy
        run: pytest -q

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
      - name: Lint PHP (obie wtyczki)
        run: |
          err=0
          find auta-iaai/wp-plugin motocykle-poleasingowe/wp-plugin -name '*.php' -print0 \
            | xargs -0 -n1 php -l >/dev/null || err=1
          exit $err
