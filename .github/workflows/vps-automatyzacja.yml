name: VPS (symulacja) — automatyzacja importera IAAI + Copart

# „Udawany VPS": ten workflow robi to, co na serwerze robi timer systemd —
#   1) stawia bazę (jak MySQL WordPressa),
#   2) uruchamia pipeline dla IAAI (próba realnego pobrania na żywo),
#   3) dokłada przykładowe auta Copart (Copart live wymaga konta Member),
#   4) eksportuje wynik (nasze-auta.sql) jako artefakt do pobrania.
#
# schedule (cron) uruchamia się automatycznie TYLKO z gałęzi domyślnej (main) —
# na tej gałęzi używaj „Run workflow" (workflow_dispatch), aby odpalić ręcznie.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # co godzinę — tak jak iaai-importer-live.timer na VPS

jobs:
  automatyzacja:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: iaai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      IAAI_DB_HOST: 127.0.0.1
      IAAI_DB_PORT: "3306"
      IAAI_DB_NAME: iaai
      IAAI_DB_USER: root
      IAAI_DB_PASS: root
      IAAI_DB_TABLE_PREFIX: ""
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zależności (jak na VPS — install.sh)
        run: |
          python -m pip install --upgrade pip
          pip install requests pymysql playwright
          python -m playwright install --with-deps chromium

      - name: Nowa baza — tabele ze schematu (dbDelta robi to samo na WP)
        run: mysql -h 127.0.0.1 -uroot -proot iaai < db/schema.sql

      - name: Automatyzacja — IAAI (live, próba realnego pobrania)
        continue-on-error: true   # anty-bot z IP GitHuba potrafi zablokować — to normalne, patrz Copart
        run: |
          python scraper/run_pipeline.py --source iaai --mode live --limit 8 --keep-going \
            || echo "::warning::IAAI live nie przeszło z IP GitHub Actions (anty-bot). Na VPS klienta działa."

      - name: Drugie źródło — Copart (przykładowe; live wymaga konta Member)
        run: python scraper/tools/seed_copart_demo.py

      - name: Podsumowanie + eksport bazy (artefakt „jak z VPS")
        run: |
          mkdir -p artefakty
          echo "== Ile aut wg źródła ==" | tee artefakty/podsumowanie.txt
          mysql -h 127.0.0.1 -uroot -proot iaai \
            -e "SELECT source, COUNT(*) AS ile FROM iaai_vehicles GROUP BY source;" \
            | tee -a artefakty/podsumowanie.txt
          echo "" | tee -a artefakty/podsumowanie.txt
          echo "== Przykładowe rekordy ==" | tee -a artefakty/podsumowanie.txt
          mysql -h 127.0.0.1 -uroot -proot iaai \
            -e "SELECT source, salvage_id, year, make, model, odometer, buy_now FROM iaai_vehicles ORDER BY source, salvage_id LIMIT 20;" \
            | tee -a artefakty/podsumowanie.txt
          # --column-statistics=0: runner ma klienta MySQL 8, baza to MariaDB (brak tabeli
          # information_schema.COLUMN_STATISTICS) — bez tej flagi mysqldump pada z błędem 1109.
          mysqldump --column-statistics=0 --no-tablespaces \
            -h 127.0.0.1 -uroot -proot iaai iaai_vehicles iaai_vehicle_images > artefakty/nasze-auta.sql

      - name: Wynik do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: nasze-auta-seed
          path: artefakty/
