<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#555"/></marker><marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#9673a6"/></marker></defs><rect x="0" y="0" width="820" height="660" fill="#ffffff"/><text x="410.0" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">Jak działa system „Nasze motory”</text><rect x="265" y="70" width="290" height="64" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text x="410.0" y="96.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">1. Portal poleasingowe.pl</text><text x="410.0" y="115.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Aukcje motocykli poleasingowych</text><rect x="265" y="185" width="290" height="78" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text x="410.0" y="209.7" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">2. Nasz system (na serwerze)</text><text x="410.0" y="227.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Co kilka godzin automatycznie pobiera</text><text x="410.0" y="246.1" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">i porządkuje oferty</text><rect x="265" y="305" width="290" height="64" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text x="410.0" y="331.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">3. Baza danych ofert</text><text x="410.0" y="350.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Aktualne motocykle w jednym miejscu</text><rect x="265" y="420" width="290" height="86" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text x="410.0" y="448.7" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">4. Twoja strona WWW</text><text x="410.0" y="466.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Podstrona „Nasze motory” —</text><text x="410.0" y="485.1" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">gotowa lista z filtrami i zdjęciami</text><rect x="600" y="420" width="200" height="86" rx="8" ry="8" fill="#f5f5f5" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/><text x="700.0" y="450.9" font-size="11" font-weight="normal" text-anchor="middle" fill="#222">Zdjęcia pokazują się wprost</text><text x="700.0" y="466.3" font-size="11" font-weight="normal" text-anchor="middle" fill="#222">z poleasingowe.pl</text><text x="700.0" y="481.7" font-size="11" font-weight="normal" text-anchor="middle" fill="#222">(bez kopiowania)</text><path d="M 410,134 L 410,185" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/><rect x="418.75" y="154" width="66.5" height="17" fill="#ffffff" opacity="0.85"/><text x="452" y="165" font-size="11" text-anchor="middle" fill="#333">pobieranie</text><path d="M 410,263 L 410,305" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/><rect x="421.875" y="278" width="36.25" height="17" fill="#ffffff" opacity="0.85"/><text x="440" y="289" font-size="11" text-anchor="middle" fill="#333">zapis</text><path d="M 410,369 L 410,420" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/><rect x="415.7" y="388" width="78.60000000000001" height="17" fill="#ffffff" opacity="0.85"/><text x="455" y="399" font-size="11" text-anchor="middle" fill="#333">wyświetlanie</text><path d="M 555,463 L 600,463" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="6 4"/><text x="410.0" y="560" font-size="13" font-style="italic" text-anchor="middle" fill="#444">Wszystko dzieje się automatycznie — nie musisz nic robić ręcznie.</text></svg>