<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1131" width="210mm" height="297mm" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="1131" fill="#ffffff"/>

  <!-- Tytuł -->
  <text x="400" y="48" text-anchor="middle" font-size="27" font-weight="bold" fill="#1a1a1a">Jak działa system</text>
  <text x="400" y="76" text-anchor="middle" font-size="14.5" fill="#555">Import aut z IAAI na Twoją stronę — automatycznie, całą dobę</text>

  <!-- IAAI -->
  <rect x="250" y="100" width="300" height="64" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="400" y="129" text-anchor="middle" font-size="18" font-weight="bold" fill="#174ea6">IAAI.com</text>
  <text x="400" y="150" text-anchor="middle" font-size="12" fill="#555">aukcje aut — źródło danych</text>

  <!-- strzałka 1 -->
  <line x1="400" y1="164" x2="400" y2="212" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="416" y="182" font-size="11.5" fill="#555">co 15 min: sprawdza nowe auta</text>
  <text x="416" y="198" font-size="11.5" fill="#555">raz dziennie: pełna synchronizacja</text>

  <!-- VPS grupa -->
  <rect x="110" y="216" width="580" height="172" rx="14" fill="#f7f7f7" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="400" y="242" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444">TWÓJ SERWER (VPS) — pracuje sam, całą dobę</text>

  <rect x="150" y="262" width="230" height="92" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
  <text x="265" y="300" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#9c5400">Program zbierający</text>
  <text x="265" y="322" text-anchor="middle" font-size="11.5" fill="#555">pobiera auta</text>
  <text x="265" y="338" text-anchor="middle" font-size="11.5" fill="#555">+ zdjęcia z IAAI</text>

  <rect x="420" y="262" width="230" height="92" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="535" y="300" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2e7d32">Baza danych</text>
  <text x="535" y="322" text-anchor="middle" font-size="11.5" fill="#555">magazyn aut</text>
  <text x="535" y="338" text-anchor="middle" font-size="11.5" fill="#555">(dane + zdjęcia)</text>

  <text x="400" y="302" text-anchor="middle" font-size="10.5" fill="#555">zapisuje</text>
  <line x1="382" y1="308" x2="418" y2="308" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- strzałka 2 -->
  <line x1="400" y1="388" x2="400" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- WordPress grupa -->
  <rect x="110" y="434" width="580" height="172" rx="14" fill="#f7f7f7" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="400" y="460" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444">TWOJA STRONA WORDPRESS</text>

  <rect x="150" y="480" width="230" height="92" rx="10" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
  <text x="265" y="518" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#5e35b1">Wtyczka</text>
  <text x="265" y="540" text-anchor="middle" font-size="11.5" fill="#555">IAAI Importer</text>
  <text x="265" y="556" text-anchor="middle" font-size="11.5" fill="#555">(czyta bazę)</text>

  <rect x="420" y="480" width="230" height="92" rx="10" fill="#e1f5fe" stroke="#039be5" stroke-width="2"/>
  <text x="535" y="518" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0277bd">Strona z autami</text>
  <text x="535" y="540" text-anchor="middle" font-size="11.5" fill="#555">ogłoszenia pojazdów</text>
  <text x="535" y="556" text-anchor="middle" font-size="11.5" fill="#555">(zdjęcia, dane, ceny)</text>

  <text x="400" y="520" text-anchor="middle" font-size="10.5" fill="#555">publikuje</text>
  <line x1="382" y1="526" x2="418" y2="526" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- strzałka 3 -->
  <line x1="400" y1="606" x2="400" y2="648" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Klienci -->
  <rect x="250" y="652" width="300" height="64" rx="12" fill="#fce4ec" stroke="#ec407a" stroke-width="2"/>
  <text x="400" y="681" text-anchor="middle" font-size="17" font-weight="bold" fill="#ad1457">Klienci / odwiedzający</text>
  <text x="400" y="702" text-anchor="middle" font-size="12" fill="#555">widzą auta na Twojej stronie</text>

  <!-- 4 kroki -->
  <text x="400" y="772" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Co dzieje się „w środku" — w 4 krokach</text>

  <rect x="30" y="792" width="165" height="78" rx="10" fill="#f1f3f4" stroke="#bbb" stroke-width="1.5"/>
  <text x="112" y="822" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">1. POBIERA</text>
  <text x="112" y="843" text-anchor="middle" font-size="11" fill="#555">auta + zdjęcia</text>
  <text x="112" y="858" text-anchor="middle" font-size="11" fill="#555">z IAAI</text>

  <rect x="225" y="792" width="165" height="78" rx="10" fill="#f1f3f4" stroke="#bbb" stroke-width="1.5"/>
  <text x="307" y="822" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">2. PORZĄDKUJE</text>
  <text x="307" y="843" text-anchor="middle" font-size="11" fill="#555">mile → kilometry,</text>
  <text x="307" y="858" text-anchor="middle" font-size="11" fill="#555">marka/model z VIN</text>

  <rect x="420" y="792" width="165" height="78" rx="10" fill="#f1f3f4" stroke="#bbb" stroke-width="1.5"/>
  <text x="502" y="822" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">3. ZAPISUJE</text>
  <text x="502" y="843" text-anchor="middle" font-size="11" fill="#555">do bazy: nowe dodaje,</text>
  <text x="502" y="858" text-anchor="middle" font-size="11" fill="#555">znikłe ukrywa</text>

  <rect x="615" y="792" width="165" height="78" rx="10" fill="#f1f3f4" stroke="#bbb" stroke-width="1.5"/>
  <text x="697" y="822" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">4. POKAZUJE</text>
  <text x="697" y="843" text-anchor="middle" font-size="11" fill="#555">na stronie jako</text>
  <text x="697" y="858" text-anchor="middle" font-size="11" fill="#555">ogłoszenia</text>

  <line x1="197" y1="831" x2="223" y2="831" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="392" y1="831" x2="418" y2="831" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="587" y1="831" x2="613" y2="831" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- info -->
  <text x="400" y="918" text-anchor="middle" font-size="12" fill="#777">Na co dzień nic nie robisz — wszystko dzieje się samo, 24 godziny na dobę.</text>

  <text x="400" y="1095" text-anchor="middle" font-size="10.5" fill="#999">Importer aut IAAI → WordPress  ·  diagram poglądowy dla klienta</text>
</svg>
